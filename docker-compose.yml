services:
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    command: >
      redis-server
      --save 60 1
      --appendonly yes
      --appendfsync everysec
      --loglevel warning
    volumes:
      - redis_data:/data
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8000:8000"
    depends_on:
      - redis
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - ./workspace:/app/workspace
      - ./config:/app/config
    restart: unless-stopped

volumes:
  redis_data:
